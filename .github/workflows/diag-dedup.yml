# TEMPORÁRIO — diagnóstico do dedup B3, rodada 2 (apagar depois).
name: diag-dedup
on:
  push:
    branches: [claude/oi-44yimr]
    paths: [.github/workflows/diag-dedup.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Linhas KNCR11 como estão gravadas
        run: |
          curl -sS --max-time 60 -o ativos.json "https://meus-investimentos-dev.vercel.app/api/sheets/meus_ativos"
          python3 - <<'PY'
          import json
          rows = json.load(open("ativos.json"))
          if rows: print("colunas:", list(rows[0].keys()))
          for r in rows:
              vals = {k: str(v) for k, v in r.items()}
              if any("KNCR11" in v.upper() for v in vals.values()):
                  print(vals)
          PY

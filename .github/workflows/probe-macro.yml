name: probe-macro-calendarios
on:
  push:
    branches: [claude/oi-44yimr]
    paths: [".github/workflows/probe-macro.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: FOMC completo 2026 e 2027
        run: |
          curl -sS --max-time 30 -A "Mozilla/5.0" -o fomc.html "https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm"
          python3 - <<'PY'
          import re
          h = open("fomc.html", encoding="utf-8", errors="ignore").read()
          for ano in ["2026", "2027"]:
              i = h.find(f"{ano} FOMC Meetings")
              if i < 0: print(ano, "ausente"); continue
              fim = h.find("FOMC Meetings", i + 10)
              bloco = h[i:fim if fim > i else i + 20000]
              texto = re.sub(r"<[^>]+>", " ", bloco)
              texto = re.sub(r"\s+", " ", texto)
              pares = re.findall(r"(January|February|March|April|May|June|July|August|September|October|November|December)(?:/[A-Za-z]+)?\s+(\d{1,2}-\d{1,2})", texto)
              print(ano, pares)
          PY
      - name: Payroll via FRED release calendar (rid=50)
        if: always()
        run: |
          for y in 2026 2027; do
            curl -sS --max-time 30 -A "Mozilla/5.0" -o fred.html "https://fred.stlouisfed.org/releases/calendar?rid=50&y=$y" || { echo "$y falhou"; continue; }
            echo "== $y ($(wc -c < fred.html) bytes)"
            python3 - <<PY
          import re
          h = open("fred.html", encoding="utf-8", errors="ignore").read()
          datas = re.findall(r"(20[0-9]{2}-[0-9]{2}-[0-9]{2})", h)
          # também formato textual
          txt = re.findall(r"((?:January|February|March|April|May|June|July|August|September|October|November|December)\s+\d{1,2},\s+$y)", h)
          print("iso:", sorted(set(d for d in datas if d.startswith("$y")))[:20])
          print("txt:", txt[:15])
          PY
          done

# Diagnóstico TEMPORÁRIO — rodada 2: o CKAN do Tesouro Transparente tem
# datastore (consulta filtrada, sem baixar o CSV inteiro)? Apagar depois.
name: diag-juros

on:
  push:
    paths: [".github/workflows/diag-juros.yml"]

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: ckan datastore
        run: |
          set +e
          B="https://www.tesourotransparente.gov.br/ckan/api/3/action"
          R="796d2059-14e9-44e3-80c9-2d9e30b405c1"
          echo "=== datastore_search limit=2 ==="
          curl -sS -m 25 -H "User-Agent: Mozilla/5.0" -o /tmp/ds -w "HTTP %{http_code} em %{time_total}s\n" \
            "$B/datastore_search?resource_id=$R&limit=2"
          head -c 900 /tmp/ds; echo
          echo "=== datastore_search_sql (última Data Base) ==="
          SQL=$(python3 -c "import urllib.parse; print(urllib.parse.quote('SELECT MAX(\"Data Base\") AS max_data FROM \"$R\"'))")
          curl -sS -m 30 -H "User-Agent: Mozilla/5.0" -o /tmp/sql -w "HTTP %{http_code} em %{time_total}s\n" \
            "$B/datastore_search_sql?sql=$SQL"
          head -c 500 /tmp/sql; echo
          echo "=== resource_show (datastore_active?) ==="
          curl -sS -m 20 -H "User-Agent: Mozilla/5.0" -o /tmp/rs -w "HTTP %{http_code}\n" "$B/resource_show?id=$R"
          python3 -c "
          import json
          try:
            d=json.load(open('/tmp/rs'))
            r=d.get('result',{})
            print('datastore_active:', r.get('datastore_active'), '| format:', r.get('format'), '| size:', r.get('size'), '| last_modified:', r.get('last_modified'))
          except Exception as e:
            print('parse falhou:', e)
          "
          echo "=== bytes finais do CSV via Range (dados recentes ficam no fim?) ==="
          curl -sS -m 30 -H "User-Agent: Mozilla/5.0" -H "Range: bytes=-1200" -o /tmp/tail -w "HTTP %{http_code} tamanho %{size_download}\n" \
            "https://www.tesourotransparente.gov.br/ckan/dataset/df56aa42-484a-4a59-8184-7676580c81e3/resource/$R/download/PrecoTaxaTesouroDireto.csv"
          tail -c 400 /tmp/tail; echo
          true

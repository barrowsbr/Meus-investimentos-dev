# Diagnóstico TEMPORÁRIO — curva de juros do Radar sem dados.
# O JSON antigo do Tesouro Direto devolve 410 (aposentado). Descobrir o
# endpoint NOVO que o site usa hoje + validar alternativas. Apagar depois.
name: diag-juros

on:
  push:
    paths: [".github/workflows/diag-juros.yml"]

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: endpoints antigos e pagina atual
        run: |
          set +e
          UA='-H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"'
          echo "=== endpoint antigo (esperado 410) ==="
          curl -sS -m 20 -o /tmp/old -w "HTTP %{http_code} em %{time_total}s\n" \
            -H "User-Agent: Mozilla/5.0" \
            "https://www.tesourodireto.com.br/json/br/com/b3/tesourodireto/service/api/treasurybondsinfo.json"
          head -c 200 /tmp/old; echo
          echo "=== fallback b3 antigo ==="
          curl -sS -m 20 -o /tmp/old2 -w "HTTP %{http_code}\n" -H "User-Agent: Mozilla/5.0" \
            "https://apitesourodireto.b3.com.br/treasury/api/v1/treasurybonds"
          head -c 200 /tmp/old2; echo
          echo "=== pagina precos-e-taxas (o site novo) ==="
          curl -sSL -m 25 -o /tmp/pg -w "HTTP %{http_code} tamanho %{size_download}\n" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml" \
            "https://www.tesourodireto.com.br/titulos/precos-e-taxas.htm"
          echo "--- candidatos a endpoint no HTML ---"
          grep -o -E '(https?:)?//[^"'"'"' ]*(api|json|tdws|treasury|bond|titulo)[^"'"'"' ]*' /tmp/pg | sort -u | head -30
          echo "--- scripts do bundle ---"
          grep -o -E 'src="[^"]+\.js[^"]*"' /tmp/pg | head -15

      - name: alternativas abertas
        run: |
          set +e
          echo "=== Tesouro Transparente CKAN (CSV historico) — HEAD ==="
          curl -sSIL -m 30 -H "User-Agent: Mozilla/5.0" \
            "https://www.tesourotransparente.gov.br/ckan/dataset/df56aa42-484a-4a59-8184-7676580c81e3/resource/796d2059-14e9-44e3-80c9-2d9e30b405c1/download/PrecoTaxaTesouroDireto.csv" \
            | grep -i -E "HTTP|content-length|content-type|last-modified" | head -8
          echo "=== BCB Focus Selic (sanidade — parte que talvez funcione) ==="
          curl -sS -m 20 -o /tmp/focus -w "HTTP %{http_code}\n" -H "User-Agent: Mozilla/5.0" \
            "https://olinda.bcb.gov.br/olinda/servico/Expectativas/versao/v1/odata/ExpectativasMercadoSelic?%24top=3&%24format=json&%24orderby=Data%20desc"
          head -c 250 /tmp/focus; echo
          true

# Diagnóstico do bot do Telegram em PRODUÇÃO ("mandei oi e nada aconteceu").
# v5 — sonda da cascata de IA (/api/diag/llm): cada modelo com chave testado
# individualmente + catálogos vivos do Groq E do Gemini (ambos aposentam ids).
# Mesmo padrão do ibkr-diag: os runners do GitHub alcançam a produção (a
# network policy do dev não), e o GitHub App do assistente não tem permissão
# de dispatch manual — editar este arquivo (merge na main) dispara o run.
# ⚠️ Repo público: a rota /api/telegram/diag devolve SÓ booleanos e metadados
# do getWebhookInfo — nunca token, chat_id ou segredo.
name: telegram-diag
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/telegram-diag.yml"]

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: "Production – meus-investimentos-dev"
    steps:
      - name: Diagnóstico do webhook (espera o deploy se a rota for nova)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET || vars.CRON_SECRET }}
        run: |
          APP_URL="${APP_URL:-https://meus-investimentos-dev.vercel.app}"
          # O push que dispara este run pode ser o MESMO que deploya a rota —
          # espera até ela existir (404 = deploy ainda no ar), máx ~6 min.
          for i in $(seq 1 24); do
            HTTP=$(curl -sS --max-time 30 -o diag.json -w '%{http_code}' \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$APP_URL/api/telegram/diag" || echo 000)
            # 200 só vale com a versão DESTE commit (campo conversas) — a
            # versão anterior da rota também respondia 200.
            [ "$HTTP" = "200" ] && jq -e '.conversas' diag.json >/dev/null 2>&1 && break
            [ "$HTTP" != "404" ] && [ "$HTTP" != "000" ] && [ "$HTTP" != "200" ] && break
            echo "aguardando o deploy desta versão (HTTP $HTTP) — tentativa $i/24"; sleep 15
          done
          echo "HTTP $HTTP"
          [ "$HTTP" = "200" ] || { cat diag.json; exit 1; }
          jq . diag.json

      - name: Sonda da cascata de IA (espera o deploy desta versão)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET || vars.CRON_SECRET }}
        run: |
          APP_URL="${APP_URL:-https://meus-investimentos-dev.vercel.app}"
          for i in $(seq 1 24); do
            HTTP=$(curl -sS --max-time 90 -o llm.json -w '%{http_code}' \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$APP_URL/api/diag/llm" || echo 000)
            [ "$HTTP" = "200" ] && jq -e '.geminiCatalogo' llm.json >/dev/null 2>&1 && break
            echo "aguardando o deploy da sonda (HTTP $HTTP) — tentativa $i/24"; sleep 15
          done
          echo "HTTP $HTTP"
          [ "$HTTP" = "200" ] || { cat llm.json; exit 1; }
          jq . llm.json

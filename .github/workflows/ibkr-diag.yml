# Diagnóstico manual do extrato IBKR Flex em PRODUÇÃO (v3 — inclui a auditoria dos marks)
# reconfigura a Flex query e queremos confirmar as seções sem entrar no app.
# Os runners do GitHub alcançam a produção (a network policy do dev não).
# ⚠️ Repo público: imprime SÓ metadados (nomes de seção/contagens) — NUNCA
# valores de NAV/dinheiro.
name: ibkr-diag
on:
  workflow_dispatch:
  # O GitHub App do assistente não tem permissão de dispatch manual — editar
  # este arquivo (via merge na main) também dispara o diagnóstico.
  push:
    branches: [main]
    paths: [".github/workflows/ibkr-diag.yml"]

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Seções do extrato Flex (produção)
        run: |
          curl -sS --max-time 90 "${APP_URL:-https://meus-investimentos-dev.vercel.app}/api/ibkr/twr?debug=1" \
            | jq '{temEquitySummary, navDiario, fluxosExternos, temChangeInNav: (.changeInNav != null), temTwrOficial: (.changeInNav.twr != null), twrOficialPct: .changeInNav.twr, inicioSerie, retornosAnomalos, marksAuditoria, secoes: [.secoes[].tag]}'

      - name: Saúde da golden source (db_cotacoes)
        run: |
          # Só metadados: contagem de dias/tickers, cobertura e Nº de anomalias.
          # NUNCA o detalhe das anomalias (traz preços) — o log do CI é público.
          curl -sS --max-time 60 "${APP_URL:-https://meus-investimentos-dev.vercel.app}/api/sync/cotacoes" \
            | jq '{firstDate, lastDate, dateCount, tickerCount, points, gaps, coveragePct: .coverage, anomalyCount,
                   anomalias: [.anomalies[] | {ticker, date, type}]}'

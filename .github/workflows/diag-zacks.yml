# TEMPORÁRIO — formato do feed do Zacks (apagar depois).
name: diag-zacks
on:
  push:
    branches: [claude/oi-44yimr]
    paths: [.github/workflows/diag-zacks.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: quote-feed.zacks.com para ação, ADR e ETF
        run: |
          for t in NVDA TSM VOO KO XYZNAOEXISTE; do
            echo "── $t"
            curl -sS --max-time 20 -A "Mozilla/5.0" "https://quote-feed.zacks.com/index?t=$t" -o r.json -w "HTTP %{http_code} · %{content_type}\n" || true
            python3 - <<PY
          import json
          try:
              d = json.load(open("r.json"))
              v = d.get("$t", d if isinstance(d, dict) else {})
              if isinstance(v, dict):
                  print({k: v.get(k) for k in ("ticker","zacks_rank","zacks_rank_text","name","updated") if k in v})
              else:
                  print("shape:", type(v).__name__, str(d)[:200])
          except Exception as e:
              print("não-JSON:", open("r.json","rb").read()[:150])
          PY
          done

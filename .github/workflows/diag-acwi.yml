# TEMPORÁRIO — descobrir a URL certa do CSV do ACWI (apagar depois).
name: diag-acwi
on:
  push:
    branches: [claude/oi-44yimr]
    paths: [.github/workflows/diag-acwi.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Testa candidatos de URL
        run: |
          try() {
            echo "── $1"
            curl -sS --max-time 40 -A "Mozilla/5.0" -o out.bin -w "HTTP %{http_code} · %{size_download}b · %{content_type}\n" "$1" || true
            head -c 200 out.bin | tr -d '\0'; echo; echo
          }
          # 1) descobrir o link real varrendo o HTML da página do produto
          curl -sS --max-time 40 -A "Mozilla/5.0" -o page.html "https://www.ishares.com/us/products/239600/ishares-msci-acwi-etf"
          echo "== links .ajax achados na página =="
          grep -o '[^"]*\.ajax[^"]*' page.html | grep -i -E "csv|holding" | head -5
          grep -o 'href="[^"]*fileType=csv[^"]*"' page.html | head -5
          # 2) candidatos diretos
          try "https://www.ishares.com/us/products/239600/ishares-msci-acwi-etf/1467271812596.ajax?fileType=csv&fileName=ACWI_holdings&dataType=fund"
          try "https://www.blackrock.com/us/individual/products/239600/ishares-msci-acwi-etf/1464253357814.ajax?fileType=csv&fileName=ACWI_holdings&dataType=fund"
          try "https://www.ishares.com/uk/individual/en/products/251850/ishares-msci-acwi-ucits-etf/1506575576011.ajax?fileType=csv&fileName=SSAC_holdings&dataType=fund"

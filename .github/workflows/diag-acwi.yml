# TEMPORÁRIO — fontes de índice mundo (apagar depois).
name: diag-acwi
on:
  push:
    branches: [claude/oi-44yimr]
    paths: [.github/workflows/diag-acwi.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: IVV iShares (controle) + SSGA SPYY + Vanguard VT
        run: |
          echo "── IVV (controle — funciona em prod)"
          curl -sS --max-time 40 -A "Mozilla/5.0" -o ivv.csv -w "HTTP %{http_code} · %{size_download}b · %{content_type}\n" \
            "https://www.ishares.com/us/products/239726/ishares-core-sp-500-etf/1467271812596.ajax?fileType=csv&fileName=IVV_holdings&dataType=fund" || true
          head -c 120 ivv.csv; echo; echo
          echo "── SSGA SPDR MSCI ACWI UCITS (SPYY)"
          curl -sS --max-time 40 -A "Mozilla/5.0" -o spyy.xlsx -w "HTTP %{http_code} · %{size_download}b · %{content_type}\n" \
            "https://www.ssga.com/library-content/products/fund-data/etfs/emea/holdings-daily-emea-en-spyy-gy.xlsx" || true
          head -c 8 spyy.xlsx | xxd | head -1; echo
          echo "── Vanguard VT (JSON)"
          curl -sS --max-time 40 -A "Mozilla/5.0" -H "Accept: application/json" -o vt.json -w "HTTP %{http_code} · %{size_download}b · %{content_type}\n" \
            "https://investor.vanguard.com/investment-products/etfs/profile/api/VT/portfolio-holding/stock" || true
          head -c 300 vt.json; echo; echo
          echo "── dissecação SSGA (se for xlsx)"
          if head -c 2 spyy.xlsx | grep -q PK; then
            pip -q install openpyxl 2>/dev/null
            python3 - <<'PY'
          import openpyxl
          wb = openpyxl.load_workbook("spyy.xlsx", read_only=True)
          ws = wb.worksheets[0]
          rows = ws.iter_rows(values_only=True)
          for i, r in enumerate(rows):
              print(i, [str(c)[:28] if c is not None else "" for c in r[:9]])
              if i > 12: break
          n = sum(1 for _ in ws.iter_rows())
          print("total linhas:", n)
          PY
          fi

name: Séries FRED (espelho p/ Vercel)

# fred.stlouisfed.org (fredgraph.csv) responde normalmente de runners do GitHub,
# mas BLOQUEIA os IPs da Vercel (anti-bot Imperva) — o detector de divergência
# macro ficava sem HY_SPREAD / US_CURVE / US10Y_REAL em produção. Este workflow
# baixa as séries aqui (onde funciona) e commita os CSVs em backups:fred/; o
# app lê o espelho via raw.githubusercontent.com (lib/macro-map/sources.ts).
# Dado público, sem segredo nenhum — não depende de CRON_SECRET.
# O backup diário da planilha só toca os CSVs da RAIZ da branch (maxdepth 1);
# o subdiretório fred/ convive sem conflito.

on:
  schedule:
    - cron: '15 21 * * 1-5'   # dias úteis 21h15 UTC (18h15 BRT)
  workflow_dispatch: {}
  push:
    branches: [main, claude/oi-44yimr]
    paths: [".github/workflows/fred-series.yml"]

permissions:
  contents: write

jobs:
  espelho:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar séries do FRED
        run: |
          mkdir -p fred
          for s in DFII10 T10Y2Y BAMLH0A0HYM2; do
            curl -sS --max-time 30 "https://fred.stlouisfed.org/graph/fredgraph.csv?id=$s&cosd=$(date -u -d '6 years ago' +%F)" -o "fred/$s.csv"
            head -1 "fred/$s.csv" | grep -qi "date" || { echo "::error::$s sem header de data"; head -c 200 "fred/$s.csv"; exit 1; }
            linhas=$(wc -l < "fred/$s.csv")
            # O motor precisa de >=250 pontos (z longo); o fredgraph entrega menos
            # histórico para algumas séries (BAMLH0A0HYM2 veio com ~800 linhas).
            [ "$linhas" -gt 400 ] || { echo "::error::$s com só $linhas linhas — resposta suspeita"; exit 1; }
            echo "$s: $linhas linhas"
          done
      - name: Publicar em backups:fred/
        run: |
          REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          mkdir repo && cd repo
          # init numa branch DESCARTÁVEL: `git fetch backups:backups` é recusado
          # quando backups é a branch atual (o erro morria no 2>/dev/null e o
          # push virava root novo → rejeitado por non-fast-forward).
          git init -b _tmp -q
          git config user.name "fred-bot"
          git config user.email "actions@github.com"
          git fetch --depth 1 "$REMOTE" backups:backups 2>/dev/null && git checkout -q backups || { echo "branch backups ainda não existe — criando"; git checkout -q -b backups; }
          mkdir -p fred && cp ../fred/*.csv fred/
          # BLINDAGEM: a branch de dados NUNCA pode deployar. Sem este arquivo,
          # cada push de bot dispara um build da Vercel que falha
          # ("Couldn't find any pages or app directory") — a Vercel lê o
          # vercel.json do COMMIT que vai deployar, então o da main não vale
          # aqui. Recriamos se sumir OU se o fallback acima tiver criado a
          # branch do zero (branch nova nasce sem o arquivo).
          if [ ! -f vercel.json ]; then
            printf '%s\n' '{' '  "git": { "deploymentEnabled": false },' '  "github": { "enabled": false }' '}' > vercel.json
            echo "::notice::vercel.json recriado na branch de dados (protecao anti-deploy)"
          fi
          git add -A
          git diff --cached --quiet && { echo "sem mudanças desde a última rodada"; exit 0; }
          git commit -q -m "séries FRED $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push "$REMOTE" backups

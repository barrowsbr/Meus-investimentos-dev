# TEMPORÁRIO — extrai o ícone real do site da Pátria (apagar depois).
name: diag-logo
on:
  push:
    branches: [claude/oi-44yimr]
    paths: [.github/workflows/diag-logo.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Icons do site
        run: |
          curl -sSL --max-time 20 -A "Mozilla/5.0" -o page.html "https://www.patria.com" -w "HTTP %{http_code}\n" || true
          grep -o '<link[^>]*rel="[^"]*icon[^"]*"[^>]*>' page.html | head -6
          for u in "https://www.patria.com/apple-touch-icon.png" "https://www.patria.com/favicon-32x32.png" "https://www.patria.com/favicon.ico"; do
            code=$(curl -sSL -A "Mozilla/5.0" -o icon.bin -w "%{http_code}" --max-time 15 "$u" || echo 000)
            size=$(wc -c < icon.bin)
            tipo=$(file -b icon.bin | head -c 60)
            echo "── $u → $code · ${size}b · $tipo"
            if [ "$code" = "200" ] && [ "$size" -gt 500 ] && [ "$size" -lt 60000 ]; then
              echo "BASE64_INICIO $u"
              base64 -w 120 icon.bin
              echo "BASE64_FIM"
              break
            fi
          done

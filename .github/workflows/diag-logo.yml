# TEMPORÁRIO — qual domínio rende favicon para os FIIs CSHG (apagar depois).
name: diag-logo
on:
  push:
    branches: [claude/oi-44yimr]
    paths: [.github/workflows/diag-logo.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Favicons candidatos
        run: |
          for d in patria.com cshg.com.br patriainvestimentos.com.br hedgingriffo.com.br; do
            r=$(curl -sSL -o f.bin -w "%{http_code} %{content_type}" --max-time 15 "https://www.google.com/s2/favicons?domain=$d&sz=128" || echo falha)
            echo "$d → $r · $(wc -c < f.bin) bytes"
          done

# TEMPORÁRIO — baixa o ícone da Pátria, converte p/ PNG e commita na branch.
name: diag-logo
on:
  push:
    branches: [claude/oi-44yimr]
    paths: [.github/workflows/diag-logo.yml]
permissions:
  contents: write
jobs:
  logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/oi-44yimr
      - name: Converte e commita
        run: |
          pip -q install pillow
          curl -sSL -A "Mozilla/5.0" --max-time 20 -o patria.ico "https://www.patria.com/favicon.ico"
          python3 - <<'PY'
          from PIL import Image
          img = Image.open("patria.ico")
          # .ico multi-tamanho: pega o maior frame
          try:
              img.size = max(img.info.get("sizes", {img.size}))
          except Exception:
              pass
          img = img.convert("RGBA").resize((128, 128), Image.LANCZOS)
          for t in ("HGCR11", "HGLG11", "HGRE11"):
              img.save(f"public/logos/{t}.png")
          print("pngs ok")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/logos/*.png
          git commit -m "Logos: FIIs CSHG com o ícone da Pátria (favicon oficial → PNG 128px)"
          git push

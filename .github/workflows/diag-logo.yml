# TEMPORÁRIO — diagnóstico de logos B3 (apagar depois).
name: diag-logo
on:
  push:
    branches: [claude/oi-44yimr]
    paths: [.github/workflows/diag-logo.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Resolver em prod × fontes diretas
        run: |
          APP="https://meus-investimentos-dev.vercel.app"
          for t in CMIG4.SA ITUB4.SA VALE3.SA KNCR11.SA IVVB11.SA PETR4.SA; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "$APP/api/logo/$t")
            echo "prod /api/logo/$t → $code"
          done
          echo "── fontes diretas por ticker B3"
          for t in CMIG4 ITUB4 VALE3 KNCR11 IVVB11 PETR4; do
            b=$(curl -sS -o /dev/null -w "%{http_code} %{content_type}" --max-time 15 "https://icons.brapi.dev/icons/$t.svg")
            p=$(curl -sS -o /dev/null -w "%{http_code} %{content_type}" --max-time 15 "https://assets.parqet.com/logos/symbol/$t?format=png&size=128")
            f=$(curl -sS -o /dev/null -w "%{http_code} %{content_type}" --max-time 15 "https://images.financialmodelingprep.com/symbol/$t.png")
            echo "$t → brapi-icons: $b | parqet: $p | fmp: $f"
          done

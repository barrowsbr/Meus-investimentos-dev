name: probe-dbnomics
on:
  push:
    branches: [claude/oi-44yimr]
    paths: [".github/workflows/probe-dbnomics.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: variante A (path)
        run: |
          curl -sS --max-time 20 "https://api.db.nomics.world/v22/series/FRED/DFII10?observations=1&format=json" | head -c 600; echo
      - name: variante B (series_ids)
        run: |
          curl -sS --max-time 20 "https://api.db.nomics.world/v22/series?series_ids=FRED/DFII10&observations=1&format=json" -o b.json
          echo "bytes: $(wc -c < b.json)"; head -c 400 b.json; echo
          python3 -c "
          import json
          d = json.load(open('b.json'))
          doc = d['series']['docs'][0]
          print('keys:', sorted(doc.keys()))
          print('tail:', list(zip(doc['period'][-3:], doc['value'][-3:])), 'n=', len(doc['period']))
          " || echo "parse B falhou"
      - name: variante B nas 3 séries
        if: always()
        run: |
          for s in T10Y2Y BAMLH0A0HYM2; do
            curl -sS --max-time 20 "https://api.db.nomics.world/v22/series?series_ids=FRED/$s&observations=1&format=json" -o x.json || continue
            python3 -c "
          import json
          d = json.load(open('x.json'))
          doc = d['series']['docs'][0]
          print('$s tail:', list(zip(doc['period'][-3:], doc['value'][-3:])), 'n=', len(doc['period']))
          " || echo "$s falhou"
          done
      - name: FRED direto (controle)
        if: always()
        run: |
          curl -sS --max-time 20 -o /dev/null -w "fredgraph http=%{http_code} t=%{time_total}s\n" "https://fred.stlouisfed.org/graph/fredgraph.csv?id=DFII10&cosd=2025-01-01" || echo "fredgraph FALHOU"

# Diagnóstico TEMPORÁRIO do histórico FIPE (página Bens) — rodada 2.
# Descobertas da rodada 1: (a) 004473-3/2020-1 dá 404 na v2 até sem reference;
# (b) referência antiga dá 402 "histórico estendido é pago". Agora: qual o
# código de ano certo do Onix na v2, e até onde vai a janela grátis.
name: diag-fipe

on:
  push:
    paths:
      - ".github/workflows/diag-fipe.yml"
      - "scripts/.diag-fipe-run"
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: anos disponiveis na v2
        run: |
          echo "=== v2/cars/004473-3/years (Onix Joy) ==="
          curl -sS -m 15 -w "\nHTTP %{http_code}\n" "https://parallelum.com.br/fipe/api/v2/cars/004473-3/years"
          echo "=== v2/cars/005508-5/years (T-Cross) ==="
          curl -sS -m 15 -w "\nHTTP %{http_code}\n" "https://parallelum.com.br/fipe/api/v2/cars/005508-5/years"
          echo "=== v1 Chevrolet: achar o Onix Joy e listar anos (comparação) ==="
          MARCA=$(curl -sS -m 15 "https://parallelum.com.br/fipe/api/v1/carros/marcas" | python3 -c "import json,sys; ms=json.load(sys.stdin); print([m['codigo'] for m in ms if 'chevrolet' in m['nome'].lower()][0])")
          echo "marca=$MARCA"
          MODELO=$(curl -sS -m 15 "https://parallelum.com.br/fipe/api/v1/carros/marcas/$MARCA/modelos" | python3 -c "
          import json,sys
          ms=json.load(sys.stdin)['modelos']
          js=[m for m in ms if 'joy' in m['nome'].lower() and 'onix' in m['nome'].lower()]
          print(js[0]['codigo'] if js else '')
          [print('CAND:', m['codigo'], m['nome'], file=sys.stderr) for m in js]
          ")
          echo "modelo=$MODELO"
          curl -sS -m 15 -w "\nHTTP %{http_code}\n" "https://parallelum.com.br/fipe/api/v1/carros/marcas/$MARCA/modelos/$MODELO/anos"

      - name: fronteira da janela gratis (T-Cross 005508-5, que funciona na v2)
        run: |
          for REF in 336 335 334 333 332 331 330 329 328 327 326 325 324 323; do
            OUT=$(curl -sS -m 15 -o /tmp/b -w "%{http_code}" "https://parallelum.com.br/fipe/api/v2/cars/005508-5/years/2025-1?reference=$REF")
            echo "ref=$REF -> HTTP $OUT $(head -c 120 /tmp/b)"
            sleep 0.4
          done

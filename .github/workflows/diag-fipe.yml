# Diagnóstico TEMPORÁRIO — rodada 4: o 403 da FIPE oficial é por falta de
# headers de navegador ou bloqueio de IP de datacenter? E o plano C (sites que
# republicam histórico FIPE) responde para robô? Apagar depois.
name: diag-fipe

on:
  push:
    paths: [".github/workflows/diag-fipe.yml"]

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: fipe oficial com headers completos
        run: |
          set +e
          H=(-H "Content-Type: application/json" \
             -H "Accept: application/json, text/javascript, */*; q=0.01" \
             -H "Accept-Language: pt-BR,pt;q=0.9" \
             -H "Origin: https://veiculos.fipe.org.br" \
             -H "Referer: https://veiculos.fipe.org.br/" \
             -H "X-Requested-With: XMLHttpRequest" \
             -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36")
          echo "=== home do site (GET) ==="
          curl -sS -m 15 -o /dev/null -w "HTTP %{http_code} em %{time_total}s\n" "https://veiculos.fipe.org.br/" -H "User-Agent: Mozilla/5.0"
          echo "=== ConsultarTabelaDeReferencia (headers completos) ==="
          curl -sS -m 15 "${H[@]}" -X POST "https://veiculos.fipe.org.br/api/veiculos/ConsultarTabelaDeReferencia" -d '{}' -w "\nHTTP %{http_code}\n" | head -c 300
          echo "=== plano C: tabelafipebrasil.com (página do Onix Joy) ==="
          curl -sS -m 15 -o /tmp/tfb -w "HTTP %{http_code} em %{time_total}s\n" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" \
            "https://www.tabelafipebrasil.com/carros/CHEVROLET/ONIX"
          head -c 300 /tmp/tfb; echo
          echo "=== plano C2: fipeapi alternativa deividfortuna (github pages?) ==="
          curl -sS -m 15 -o /dev/null -w "HTTP %{http_code}\n" "https://fipe.parallelum.com.br/api/v2/references" -H "User-Agent: Mozilla/5.0"
          true

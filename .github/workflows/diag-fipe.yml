# Diagnóstico TEMPORÁRIO do histórico FIPE (página Bens) — roda no runner do
# GitHub porque a rede do ambiente de dev bloqueia tanto a produção quanto a
# parallelum. Testa: (1) a API da FIPE direto, com e sem ?reference=; (2) o
# endpoint de produção. Apagar quando o problema estiver resolvido.
name: diag-fipe

on:
  push:
    paths:
      - ".github/workflows/diag-fipe.yml"
      - "scripts/.diag-fipe-run"
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: parallelum direto
        run: |
          echo "=== v2/references (5 primeiras) ==="
          curl -sS -m 15 -w "\nHTTP %{http_code} em %{time_total}s\n" \
            "https://parallelum.com.br/fipe/api/v2/references" | head -c 400
          echo
          REF=$(curl -sS -m 15 "https://parallelum.com.br/fipe/api/v2/references" | python3 -c "import json,sys; print(json.load(sys.stdin)[1]['code'])" || echo "")
          echo "ref anterior = $REF"
          echo "=== valor SEM reference (Onix Joy 004473-3, 2020-1) ==="
          curl -sS -m 15 -w "\nHTTP %{http_code} em %{time_total}s\n" \
            "https://parallelum.com.br/fipe/api/v2/cars/004473-3/years/2020-1"
          echo "=== valor COM reference=$REF ==="
          curl -sS -m 15 -w "\nHTTP %{http_code} em %{time_total}s\n" \
            "https://parallelum.com.br/fipe/api/v2/cars/004473-3/years/2020-1?reference=$REF"
          echo "=== referência ANTIGA (código 200, ~2016) — deve ser 404/erro p/ ano-modelo 2020 ==="
          curl -sS -m 15 -w "\nHTTP %{http_code} em %{time_total}s\n" \
            "https://parallelum.com.br/fipe/api/v2/cars/004473-3/years/2020-1?reference=200"

      - name: producao /api/bens/fipe/historico
        run: |
          echo "=== historico Onix (12 meses só, mais rápido) ==="
          curl -sS -m 120 -D /tmp/h1 -w "\nHTTP %{http_code} em %{time_total}s\n" \
            "https://meus-investimentos-dev.vercel.app/api/bens/fipe/historico?codigo=004473-3&ano=2020&meses=12" | head -c 800
          echo; grep -i -E "x-vercel|cache-control|age" /tmp/h1 || true
          echo "=== historico Onix COMPLETO ==="
          curl -sS -m 120 -D /tmp/h2 -w "\nHTTP %{http_code} em %{time_total}s\n" \
            "https://meus-investimentos-dev.vercel.app/api/bens/fipe/historico?codigo=004473-3&ano=2020" | head -c 800
          echo; grep -i -E "x-vercel|cache-control|age" /tmp/h2 || true
          echo "=== fipe principal (sanidade) ==="
          curl -sS -m 60 -w "\nHTTP %{http_code} em %{time_total}s\n" \
            "https://meus-investimentos-dev.vercel.app/api/bens/fipe" | head -c 400

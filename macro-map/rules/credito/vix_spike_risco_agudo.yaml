id: credito.vix_spike.risco_agudo
version: 1
familia: credito
titulo: "VIX dispara → risk-off agudo em bloco"

choque:
  driver: VIX
  metrica: retorno_2d
  direcao: alta
  limiar_sigma: 2.5

canal: >
  Diferente da regra do VIX comprimido (que mede complacência estrutural), aqui
  é o pânico: a volatilidade implícita explode e o mercado tira risco de tudo ao
  mesmo tempo. É um evento contemporâneo e correlacionado — as ações caem, o
  ouro sobe como proteção e o real enfraquece no movimento de fuga para o dólar.

efeitos:
  - ativo: SPX
    sinal: -1
    defasagem_dias: [0, 2]
    confianca: alta
  - ativo: GOLD
    sinal: 1
    defasagem_dias: [0, 3]
    confianca: media
  - ativo: USDBRL
    sinal: 1
    defasagem_dias: [0, 3]
    confianca: media

regime:
  vale_quando: "O salto do VIX tem seguimento (estresse real, não ruído de um dia)."
  inverte_quando: >
    O spike é técnico e efêmero (vencimento de opções, evento pontual) e se
    desfaz no dia seguinte sem risco sistêmico — aí os efeitos não vêm.
  proxy_de_regime: "persistência do VIX elevado nos dias seguintes ao salto"

evidencia:
  janela: 24m
  metodo: "event study em saltos >= 2,5 sigma do VIX"
  taxa_acerto: null
  n_eventos: null

falsificacao: >
  Em 24 meses, os saltos >= 2,5 sigma do VIX não coincidem com queda do S&P e
  alta do ouro na janela — o pânico não se traduz no risk-off esperado.

relevancia_portfolio: [VWRA, SHV, PATRIMONIO_BRL]

id: brasil.selic_corte_expectativa.carry_encolhe
version: 1
familia: brasil
titulo: "Expectativa de corte de Selic encolhe o carry e tira suporte do real"

canal: >
  O real é uma das moedas de maior carry do mundo, e boa parte do fluxo que o
  sustenta é atraída por esse diferencial de juros. Quando a expectativa de
  Selic (Focus) cai — mercado precifica ciclo de corte à frente — o carry
  esperado encolhe, o incentivo ao fluxo carry-trade diminui e o real perde um
  de seus suportes estruturais (USDBRL sobe). O driver é a EXPECTATIVA, não a
  Selic realizada: o câmbio antecipa o ciclo.

choque:
  driver: SELIC_EXP
  metrica: variacao_bps_20d
  direcao: queda
  limiar_sigma: 1.5

efeitos:
  - ativo: USDBRL
    sinal: 1
    defasagem_dias: [0, 10]
    confianca: media

regime:
  vale_quando: "Diferencial de juros é o driver dominante do fluxo cambial (ambiente de carry)."
  inverte_quando: >
    O corte esperado é lido como VITÓRIA sobre a inflação com âncora fiscal
    crível: nesse caso a queda de juros vem com queda de prêmio de risco, entra
    fluxo de portfólio e o real pode FORTALECER apesar do carry menor. O sinal
    depende de qual narrativa domina — desinflação virtuosa vs. afrouxamento
    forçado.
  proxy_de_regime: "tendência conjunta de SELIC_EXP e do prêmio de risco (BR_RISK_PREMIUM)"

evidencia:
  janela: 24m
  metodo: "correlação rolante entre revisões da Focus e USDBRL + event study"
  taxa_acerto: null
  n_eventos: null

falsificacao: >
  Três revisões consecutivas >= 1,5 sigma para baixo da expectativa de Selic
  sem enfraquecimento do real na janela [0,10], em ambiente de carry dominante.

relevancia_portfolio: [SHV, PATRIMONIO_BRL]

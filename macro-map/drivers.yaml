# Vocabulário canônico de séries — Mapa de Transmissão Macro
#
# Toda `choque.driver` e todo `efeitos[].ativo` de uma regra DEVE existir aqui
# (o teste macro-map/schema/rules.test.ts falha em CI se referenciar símbolo
# fora deste catálogo). As regras falam neste vocabulário simbólico e ESTÁVEL;
# o adapter (Fase 0→2) é quem resolve cada símbolo para a fonte real. Isso é o
# Princípio 1 (fonte única): o mesmo nome vale no YAML, no PDF e no runtime.
#
# `prontidao` é o veredito da Fase 0 (reconhecimento) sobre a base de dados:
#   pronto       — série JÁ PERSISTIDA em db_cotacoes (Google Sheets), com
#                  histórico diário suficiente p/ z-score rolante hoje.
#   backfill     — o app JÁ SABE buscar do Yahoo (rota viva ou lib/cotacoes.ts),
#                  mas NÃO persiste histórico. Basta adicionar o símbolo à
#                  lib/sync-cotacoes.ts + 1 backfill (Yahoo range=max funciona).
#   fonte_nova   — a série NÃO EXISTE no app. Precisa integrar uma fonte externa
#                  nova antes da Fase 2. É o gap real que muda o desenho.
#
# `fonte`/`simbolo_fonte` são pista para o adapter, não contrato — podem mudar.

drivers:
  # ── Commodities ────────────────────────────────────────────────────────────
  - simbolo: BRENT
    nome: "Petróleo Brent"
    classe: commodity
    fonte: yahoo
    simbolo_fonte: "BZ=F"
    persistido: false
    prontidao: backfill
    nota: "Cotado ao vivo no Radar (lib/radar/commodities.ts), não persistido."
  - simbolo: GOLD
    nome: "Ouro (futuro)"
    classe: commodity
    fonte: yahoo
    simbolo_fonte: "GC=F"
    persistido: false
    prontidao: backfill
    nota: "Futuro (GC=F), não spot XAUUSD. Ao vivo no Radar; não persistido."

  # ── Câmbio / dólar ─────────────────────────────────────────────────────────
  - simbolo: DXY
    nome: "Índice do dólar (DXY)"
    classe: fx
    fonte: yahoo
    simbolo_fonte: "DX-Y.NYB"
    persistido: false
    prontidao: backfill
    nota: "Ao vivo + fallback sintético (cesta FX) em app/api/moedas. Não persistido."
  - simbolo: USDBRL
    nome: "Dólar / Real"
    classe: fx
    fonte: yahoo
    simbolo_fonte: "BRL=X"
    persistido: true
    prontidao: pronto
    nota: "Coluna em db_cotacoes (close diário). Base pronta p/ z-score."

  # ── Juros EUA ──────────────────────────────────────────────────────────────
  - simbolo: US10Y
    nome: "Yield do Treasury 10 anos"
    classe: rate
    fonte: yahoo
    simbolo_fonte: "^TNX"
    persistido: false
    prontidao: backfill
    nota: "Yield real (não preço de bond). Rota /api/bolsas/yields já busca ^TNX+curva, mas está MORTA (nenhum componente consome) e nada é persistido."
  - simbolo: US02Y
    nome: "Yield do Treasury 2 anos"
    classe: rate
    fonte: yahoo
    simbolo_fonte: "2YY=F"
    persistido: false
    prontidao: backfill
    nota: "Parte da curva já buscada pela rota morta de yields. Inclinação 10y-2y computável."
  - simbolo: US10Y_REAL
    nome: "Yield real do Treasury 10 anos (TIPS)"
    classe: rate
    fonte: fred
    simbolo_fonte: "DFII10"
    persistido: false
    prontidao: integrado
    nota: "INTEGRADO via FRED DFII10 (CSV/fredgraph, livre, sem key). Driver correto p/ custo de oportunidade do ouro."

  # ── Ações / volatilidade EUA ───────────────────────────────────────────────
  - simbolo: SPX
    nome: "S&P 500"
    classe: equity
    fonte: yahoo
    simbolo_fonte: "^GSPC"
    persistido: true
    prontidao: pronto
    nota: "Coluna em db_cotacoes (^GSPC e ^SP500TR). Pronto."
  - simbolo: IBOV
    nome: "Ibovespa"
    classe: equity
    fonte: yahoo
    simbolo_fonte: "^BVSP"
    persistido: true
    prontidao: pronto
    nota: "Coluna em db_cotacoes (^BVSP). Pronto. Pesado em Petrobras/mineração — sensível a commodities."
  - simbolo: US_SMALLCAP
    nome: "Small caps EUA (Russell 2000)"
    classe: equity
    fonte: yahoo
    simbolo_fonte: "^RUT"
    persistido: false
    prontidao: backfill
    nota: "Não está no Radar hoje. Yahoo ^RUT resolve; adicionar à sync."
  - simbolo: VIX
    nome: "Índice de volatilidade (VIX)"
    classe: vol
    fonte: yahoo
    simbolo_fonte: "^VIX"
    persistido: false
    prontidao: backfill
    nota: "Ao vivo no Radar (lib/radar/indices.ts), excluído da matemática de breadth. Não persistido."

  # ── Crédito EUA ────────────────────────────────────────────────────────────
  - simbolo: HY_SPREAD
    nome: "Spread de high yield EUA (OAS)"
    classe: credito
    fonte: fred
    simbolo_fonte: "BAMLH0A0HYM2"
    persistido: false
    prontidao: integrado
    nota: "INTEGRADO via FRED BAMLH0A0HYM2 (ICE BofA US HY OAS, livre). Era ausente do app (nenhum HYG/JNK/OAS)."

  # ── Brasil — juros e prêmio de risco ───────────────────────────────────────
  - simbolo: SELIC_EXP
    nome: "Expectativa de Selic (Focus)"
    classe: br_rate
    fonte: bcb
    simbolo_fonte: "Olinda/Expectativas (Focus)"
    persistido: false
    prontidao: integrado
    nota: "INTEGRADO via BCB Olinda/Expectativas (Focus, livre): mediana da Selic esperada para o ano seguinte (horizonte rolante). Diferente da Selic META (SGS 432, que é nível)."
  - simbolo: BR_10Y
    nome: "Juro longo Brasil (NTN-B / DI longo)"
    classe: br_rate
    fonte: fonte_nova
    simbolo_fonte: "—"
    persistido: false
    prontidao: fonte_nova
    nota: "Não existe no app (sem curva DI, sem NTN-B). Candidatos: ANBIMA (NTN-B), B3 DI futuro. Sem fonte livre trivial — maior gap da perna Brasil."
  - simbolo: BR_RISK_PREMIUM
    nome: "Prêmio de risco Brasil (proxy)"
    classe: risk
    fonte: proxy
    simbolo_fonte: "^GSPC / EWZ"
    persistido: false
    prontidao: integrado
    nota: "INTEGRADO via proxy razão S&P 500 / EWZ (ambos Yahoo): sobe quando o Brasil desempenha pior que os EUA — cresce com o prêmio de risco. CDS 5y seria ideal mas não tem fonte livre. Driver nomeado do ciclo eleitoral 2026."
